name: Kashya
description: Kashya Inc. was a data-protection software company providing continuous data protection
  (CDP) and heterogeneous, storage-agnostic data replication for enterprise disaster recovery and
  business continuity. Founded around 2000 with headquarters in San Jose, California and research
  and development in Israel, and backed by Battery Ventures among other investors, Kashya was acquired
  by EMC Corporation in 2006 for a reported ~$153 million. Its technology became the foundation of
  EMC RecoverPoint. The company has been defunct since the acquisition and operates no independent
  website, developer portal, or public API surface today.
